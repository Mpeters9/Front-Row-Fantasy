<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Row Fantasy - Player Rankings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col font-poppins bg-gradient-to-br from-[#0f2027] to-[#2c5364]">
    <header class="sticky top-0 z-50 bg-opacity-98 bg-gray-900 shadow-lg border-b-2 border-teal-500">
    </header>

    <main class="flex-grow max-w-7xl mx-auto py-8 px-4 w-full">
        <section id="players-page">
            <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-teal-300 mb-4 text-glow-gold text-center">Player Rankings</h1>
            <p class="text-lg md:text-xl text-teal-200 max-w-3xl mx-auto text-center mb-8">
                Search, sort, and filter through all players to find your next league winner.
            </p>
            
            <div class="p-4 md:p-6 bg-gray-800 bg-opacity-80 rounded-xl shadow-lg border border-teal-600 mb-8">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
                    <div>
                        <label for="player-search-input" class="block text-sm font-medium text-gray-300 mb-1">Player Name</label>
                        <input type="text" id="player-search-input" class="form-input" placeholder="e.g. Ja'Marr Chase">
                    </div>
                     <div>
                        <label for="position-filter" class="block text-sm font-medium text-gray-300 mb-1">Position</label>
                        <select id="position-filter" class="form-select">
                            <option value="ALL">All Positions</option>
                            <option value="QB">QB</option>
                            <option value="RB">RB</option>
                            <option value="WR">WR</option>
                            <option value="TE">TE</option>
                            <option value="FLEX">FLEX (RB/WR/TE)</option>
                            <option value="K">K</option>
                            <option value="DST">DST</option>
                        </select>
                    </div>
                     <div>
                        <label for="tier-filter" class="block text-sm font-medium text-gray-300 mb-1">Tier</label>
                        <select id="tier-filter" class="form-select">
                            <option value="ALL">All Tiers</option>
                        </select>
                    </div>
                    <div>
                        <label for="team-filter" class="block text-sm font-medium text-gray-300 mb-1">NFL Team</label>
                        <select id="team-filter" class="form-select">
                            <option value="ALL">All Teams</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto tool-card p-0">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-gray-700 bg-opacity-80 text-teal-300 uppercase text-sm">
                        <tr>
                           <th class="p-4 sortable-header" data-sort="name">Player</th>
                           <th class="p-4 text-center sortable-header" data-sort="simplePosition">Pos</th>
                           <th class="p-4 text-center sortable-header hidden sm:table-cell" data-sort="team">Team</th>
                           <th class="p-4 text-center sortable-header hidden md:table-cell" data-sort="tier">Tier</th>
                           <th class="p-4 text-center sortable-header sorted-asc" data-sort="adp_ppr">ADP</th>
                           <th class="p-4 text-center sortable-header hidden sm:table-cell" data-sort="vorp">VORP</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body" class="bg-gray-900 bg-opacity-70 divide-y divide-gray-700 text-white">
                        <tr><td colspan="6"><div class="loader my-8"></div></td></tr>
                    </tbody>
                </table>
            </div>

        </section>
    </main>
    <div id="player-popup-card" class="hidden"></div>
    <footer class="bg-gray-900 text-teal-400 py-6 border-t-2 border-teal-500 mt-12">
    </footer>
   <script src="script.js"></script>
</body>
</html>
