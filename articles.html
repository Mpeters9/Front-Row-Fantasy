<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Row Fantasy - AI Briefing Room</title>
    <meta name="description" content="Generate custom, AI-powered fantasy football articles and strategy guides on demand.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col font-poppins bg-gradient-to-br from-[#0f2027] to-[#2c5364]">
    <header class="sticky top-0 z-50 bg-opacity-98 bg-gray-900 shadow-lg border-b-2 border-teal-500">
    </header>

    <main class="flex-grow max-w-7xl mx-auto py-8 px-4 w-full">
        <section id="articles-page">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-teal-300 mb-4 text-glow-gold text-center">AI Briefing Room</h1>
            <p class="text-lg md:text-xl text-teal-200 max-w-3xl mx-auto text-center mb-12">
                Your personal fantasy analyst is on call. Ask anything, and get a custom-written briefing in seconds.
            </p>

            <div class="tool-card max-w-4xl mx-auto">
                <div class="mb-6">
                    <label for="ai-article-prompt" class="block text-lg font-semibold text-gray-300 mb-2">What do you want to know?</label>
                    <textarea id="ai-article-prompt" class="form-input w-full h-24" placeholder="e.g., Write an article about the top 5 breakout wide receivers for this season..."></textarea>
                    <button id="generate-article-btn" class="cta-btn w-full mt-4 text-lg">Generate Briefing</button>
                </div>

                <div class="mt-4">
                    <h4 class="font-semibold text-teal-300 mb-2">Or, try one of these prompts:</h4>
                    <div id="example-prompts" class="flex flex-wrap gap-2">
                    </div>
                </div>
            </div>

            <article id="article-output-container" class="prose prose-invert prose-lg max-w-4xl mx-auto mt-12 tool-card p-4 md:p-8">
                <p class="text-center text-gray-400">Your generated briefing will appear here.</p>
            </article>

        </section>
    </main>

    <footer class="bg-gray-900 text-teal-400 py-6 border-t-2 border-teal-500 mt-12">
    </footer>
    <script src="main.js"></script>
    <script src="articles.js"></script>
</body>
</html>
