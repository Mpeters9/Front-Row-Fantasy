<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Row Fantasy - GOAT Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js" defer></script>
</head>
<body class="min-h-screen flex flex-col font-poppins bg-gradient-to-br from-[#0f2027] to-[#2c5364]">
    <header class="sticky top-0 z-50 bg-opacity-98 bg-gray-900 shadow-lg border-b-2 border-teal-500">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center py-3">
            <a href="index.html" class="text-xl md:text-2xl font-bold text-yellow-400 text-glow">Front Row Fantasy</a>
            <nav class="hidden md:flex space-x-6 text-teal-200">
                <a href="index.html" class="hover:text-yellow-400 transition-colors">Home</a>
                <a href="goat.html" class="text-yellow-400 font-bold" aria-current="page">GOAT</a>
                <a href="mock-draft.html" class="hover:text-yellow-400 transition-colors">Mock Draft</a>
                <a href="articles.html" class="hover:text-yellow-400 transition-colors">Articles</a>
                <a href="players.html" class="hover:text-yellow-400 transition-colors">Players</a>
                <a href="stats.html" class="hover:text-yellow-400 transition-colors">The Lab</a>
                <a href="waiver-wire.html" class="hover:text-yellow-400 transition-colors">Waiver Wire</a>
                <a href="league-dominator.html" class="hover:text-yellow-400 transition-colors">League Dominator</a>
                <a href="dynasty-dashboard.html" class="hover:text-yellow-400 transition-colors">Dynasty</a>
                <a href="my-league.html" class="hover:text-yellow-400 transition-colors">My League</a>
            </nav>
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-teal-400 hover:text-yellow-400 focus:outline-none">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>
        </div>
        <nav id="mobile-menu" class="md:hidden hidden px-4 pb-3 space-y-2"></nav>
    </header>

    <main class="flex-grow max-w-7xl mx-auto py-4 md:py-8 px-2 md:px-4 w-full">
        <section id="goat-hub-page">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-teal-300 mb-4 text-glow-gold text-center">G.O.A.T. Hub</h1>
            <p class="text-lg md:text-xl text-teal-200 max-w-3xl mx-auto text-center mb-8">
                Your ultimate draft preparation war room. AI-driven plans, simulators, cheat sheets, and analysis in one place.
            </p>

            <div x-data="{ tab: 'perfect-draft' }" class="tool-card p-2 md:p-0">
                <div class="border-b border-gray-700 overflow-x-auto">
                    <nav class="-mb-px flex space-x-6 md:space-x-8 px-4 md:px-6" aria-label="Tabs">
                         <button @click="tab = 'perfect-draft'" :class="{ 'border-teal-400 text-teal-300': tab === 'perfect-draft', 'border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-300': tab !== 'perfect-draft' }" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-base md:text-lg">
                            Perfect Draft
                        </button>
                        <button @click="tab = 'plan'" :class="{ 'border-teal-400 text-teal-300': tab === 'plan', 'border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-300': tab !== 'plan' }" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-base md:text-lg">
                            AI Draft Plan
                        </button>
                        <button @click="tab = 'sheet'" :class="{ 'border-teal-400 text-teal-300': tab === 'sheet', 'border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-300': tab !== 'sheet' }" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-base md:text-lg">
                            AI Cheat Sheet
                        </button>
                        <button @click="tab = 'trade'" :class="{ 'border-teal-400 text-teal-300': tab === 'trade', 'border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-300': tab !== 'trade' }" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-base md:text-lg">
                            Trade Analyzer
                        </button>
                         <button @click="tab = 'chat'" :class="{ 'border-teal-400 text-teal-300': tab === 'chat', 'border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-300': tab !== 'chat' }" class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-base md:text-lg">
                            AI Analyst
                        </button>
                    </nav>
                </div>
                <div class="p-2 md:p-6">
                    <div x-show="tab === 'plan'" id="goat-draft-plan-container">
                        </div>

                    <div x-show="tab === 'perfect-draft'" id="goat-draft-build-container">
                        </div>

                    <div x-show="tab === 'sheet'" id="goat-cheat-sheet-container">
                        </div>

                    <div x-show="tab === 'trade'" id="goat-trade-analyzer-container">
                        <div id="trade-analyzer">
                            <div class="flex flex-col md:flex-row justify-center items-center mb-6">
                                <h2 class="text-2xl md:text-3xl font-bold text-teal-300 mb-4 md:mb-0 md:mr-6">Trade Analyzer</h2>
                                <div id="trade-type-toggle" class="flex rounded-full bg-gray-800 p-1">
                                    <button class="trade-type-btn" data-type="Redraft">Redraft</button>
                                    <button class="trade-type-btn" data-type="Dynasty">Dynasty</button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 items-start">
                                <div class="trade-card p-4 md:p-6 space-y-4">
                                    <h3 class="font-bold text-xl text-yellow-400 mb-3">You Give</h3>
                                    <div class="relative">
                                        <input type="text" id="trade-search-1" class="form-input" placeholder="Search Player...">
                                        <ul id="trade-autocomplete-1" class="autocomplete-list"></ul>
                                    </div>
                                    <div class="trade-pick-controls hidden">
                                        <div class="grid grid-cols-3 gap-2 items-center">
                                            <select id="trade-pick-year-1" class="form-select col-span-1"><option value="2025">2025</option><option value="2026">2026</option></select>
                                            <select id="trade-pick-round-1" class="form-select col-span-1"><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option></select>
                                            <input type="number" id="trade-pick-number-1" class="form-input col-span-1" placeholder="Pick #">
                                        </div>
                                        <button id="add-pick-btn-1" class="w-full mt-2 bg-teal-800/50 text-teal-200 p-2 rounded-md hover:bg-teal-700/50 transition">Add Pick</button>
                                    </div>
                                    <div id="trade-team-1" class="space-y-2 pt-2 min-h-[50px]"></div>
                                </div>
                                <div class="trade-card p-4 md:p-6 space-y-4">
                                    <h3 class="font-bold text-xl text-green-400 mb-3">You Get</h3>
                                    <div class="relative">
                                        <input type="text" id="trade-search-2" class="form-input" placeholder="Search Player...">
                                        <ul id="trade-autocomplete-2" class="autocomplete-list"></ul>
                                    </div>
                                     <div class="trade-pick-controls hidden">
                                        <div class="grid grid-cols-3 gap-2 items-center">
                                            <select id="trade-pick-year-2" class="form-select col-span-1"><option value="2025">2025</option><option value="2026">2026</option></select>
                                            <select id="trade-pick-round-2" class="form-select col-span-1"><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option></select>
                                             <input type="number" id="trade-pick-number-2" class="form-input col-span-1" placeholder="Pick #">
                                        </div>
                                         <button id="add-pick-btn-2" class="w-full mt-2 bg-teal-800/50 text-teal-200 p-2 rounded-md hover:bg-teal-700/50 transition">Add Pick</button>
                                    </div>
                                    <div id="trade-team-2" class="space-y-2 pt-2 min-h-[50px]"></div>
                                </div>
                            </div>
                            <div class="text-center mt-8">
                                <button id="analyze-trade-btn" class="cta-btn text-lg">Analyze Trade</button>
                            </div>
                            <div id="trade-results" class="hidden mt-8 tool-card p-6"></div>
                        </div>
                    </div>

                     <div x-show="tab === 'chat'" id="goat-ai-analyst-container">
                        <div class="flex flex-col h-[60vh] bg-gray-900/40 rounded-lg">
                            <h2 class="text-2xl font-bold text-teal-300 text-center p-4 border-b border-gray-700">AI Analyst Chat</h2>
                            <div id="chat-window" class="flex-grow p-4 space-y-4 overflow-y-auto">
                                </div>
                            <div class="p-4 border-t border-gray-700 flex items-center">
                                <input type="text" id="chat-input" class="form-input flex-grow" placeholder="Ask about a player, trade, or strategy...">
                                <button id="send-chat-button" class="cta-btn !rounded-lg !px-6 !py-3 ml-4">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="player-popup-card" class="hidden"></div>

    <footer class="bg-gray-900 text-teal-400 py-6 border-t-2 border-teal-500">
        </footer>
    <script src="script.js"></script>
</body>
</html>
