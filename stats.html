<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Row Fantasy - The Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen flex flex-col font-poppins bg-gradient-to-br from-[#0f2027] to-[#2c5364]">
    <header class="sticky top-0 z-50 bg-opacity-98 bg-gray-900 shadow-lg border-b-2 border-teal-500">
    </header>

    <main class="flex-grow max-w-7xl mx-auto py-8 px-4 w-full">
        <section id="stats-page">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-teal-300 mb-4 text-glow-gold text-center">The Lab</h1>
            <p class="text-lg md:text-xl text-teal-200 max-w-3xl mx-auto text-center mb-12">
                Go beyond the box score with predictive analytics and AI-powered player comparisons.
            </p>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <div id="stats-chart-container" class="tool-card p-4 md:p-6">
                    <h3 class="text-2xl font-bold text-center mb-4 text-teal-300">Player Comparison</h3>
                    <div class="h-96 w-full">
                        <canvas id="stats-chart"></canvas>
                    </div>
                </div>
                 <div id="similar-player-container" class="tool-card p-4 md:p-6">
                    <h3 class="text-2xl font-bold text-center mb-4 text-teal-300">Find a Similar Player</h3>
                     <div class="relative">
                        <select id="similar-player-select" class="form-select"></select>
                    </div>
                     <button id="find-similar-player-btn" class="cta-btn w-full mt-4">Find Player</button>
                     <div id="similar-player-results" class="mt-4"></div>
                </div>
            </div>

            <div id="proactive-ai-container" class="tool-card p-4 md:p-6 mb-8 hidden">
                <h3 class="text-2xl font-bold text-center mb-4 text-teal-300">AI Assistant</h3>
                <p id="proactive-ai-suggestion" class="text-center text-lg text-gray-300"></p>
                <div class="flex justify-center mt-4">
                    <button id="proactive-ai-yes" class="cta-btn !bg-green-500 !text-white mr-4">Yes</button>
                    <button id="proactive-ai-no" class="cta-btn !bg-red-500 !text-white">No</button>
                </div>
            </div>


            <div class="tool-card p-0">
                <div class="p-4 md:p-6 border-b border-gray-700">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 items-end">
                        <div>
                            <label for="stats-position-filter" class="block text-sm font-medium text-gray-300 mb-1">Position</label>
                            <select id="stats-position-filter" class="form-select">
                                <option value="ALL">All Players</option>
                                <option value="FLEX">FLEX (RB/WR/TE)</option>
                                <option value="QB">QB</option>
                                <option value="RB">RB</option>
                                <option value="WR">WR</option>
                                <option value="TE">TE</option>
                            </select>
                        </div>
                        <div>
                            <label for="stats-sort-by" class="block text-sm font-medium text-gray-300 mb-1">Sort By</label>
                            <select id="stats-sort-by" class="form-select">
                                <option value="fantasyPoints">Fantasy Points</option>
                                <option value="vorp">VORP</option>
                                <option value="airYards">Air Yards</option>
                                <option value="redzoneTouches">RZ Touches</option>
                                <option value="adp_ppr">ADP (PPR)</option>
                                <option value="name">Name (A-Z)</option>
                            </select>
                        </div>
                        <div>
                            <label for="stats-player-search" class="block text-sm font-medium text-gray-300 mb-1">Player Name</label>
                            <input type="text" id="stats-player-search" class="form-input" placeholder="e.g., CeeDee Lamb...">
                        </div>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead id="stats-table-head" class="bg-gray-700 bg-opacity-80 text-teal-300 uppercase text-sm">
                            </thead>
                        <tbody id="stats-table-body" class="bg-gray-900 bg-opacity-70 divide-y divide-gray-700 text-white">
                            <tr><td colspan="8"><div class="loader my-8"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="player-popup-card" class="hidden"></div>

    <footer class="bg-gray-900 text-teal-400 py-6 border-t-2 border-teal-500 mt-12">
    </footer>

    <script src="main.js"></script>
    <script src="stats.js"></script>
</body>
</html>
