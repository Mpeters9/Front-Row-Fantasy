<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Row Fantasy - League Dominator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col font-poppins bg-gradient-to-br from-[#0f2027] to-[#2c5364]">
    <header class="sticky top-0 z-50 bg-opacity-98 bg-gray-900 shadow-lg border-b-2 border-teal-500">
    </header>

    <main class="flex-grow max-w-7xl mx-auto py-8 px-4 w-full">
        <section id="league-dominator-page">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-teal-300 mb-4 text-glow-gold text-center">League Dominator</h1>
            <p class="text-lg md:text-xl text-teal-200 max-w-3xl mx-auto text-center mb-12">
                Get an AI-powered breakdown of your league's power structure, playoff odds, and weekly drama.
            </p>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 tool-card p-4 md:p-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-center mb-6 text-teal-300">Power Rankings</h2>
                    <div id="power-rankings-list" class="space-y-3"><div class="loader"></div></div>
                </div>
                <div class="lg:col-span-1 space-y-8">
                    <div class="tool-card p-4 md:p-6">
                        <h2 class="text-2xl md:text-3xl font-bold text-center mb-6 text-teal-300">Playoff Odds</h2>
                        <div id="playoff-odds-list" class="space-y-3"><div class="loader"></div></div>
                    </div>
                    <div class="tool-card p-4 md:p-6">
                        <h2 class="text-2xl md:text-3xl font-bold text-center mb-6 text-teal-300">Commissioner's Report</h2>
                        <div id="commissioner-report-content" class="space-y-3"><div class="loader"></div></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="player-popup-card" class="hidden"></div>
    
    <footer class="bg-gray-900 text-teal-400 py-6 border-t-2 border-teal-500 mt-12">
    </footer>
   <script src="script.js"></script>
</body>
</html>
