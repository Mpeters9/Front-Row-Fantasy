<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Front Row Fantasy - Your ultimate destination for fantasy football success. Access real-time stats, expert tools, and community insights to dominate your league.">
    <meta name="keywords" content="fantasy football, draft strategies, player rankings, real-time stats, expert tools">
    <title>Front Row Fantasy - Ultimate Fantasy Football Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col font-poppins bg-gradient-to-br from-[#0f2027] to-[#2c5364]">
    <header class="sticky top-0 z-50 bg-opacity-98 bg-gray-900 shadow-lg border-b-2 border-teal-500">
    </header>

    <section class="bg-gray-800 bg-opacity-80 p-3 shadow-lg w-full border-y border-teal-800">
        <div class="overflow-hidden relative h-8 bg-gray-900 rounded-lg">
            <div id="tickerContent" class="whitespace-nowrap absolute top-0 left-0 h-full flex items-center ticker-animation text-gray-300">
            </div>
        </div>
    </section>

    <main class="flex-grow max-w-7xl mx-auto py-8 px-4 w-full">
        <section class="text-center mb-12 md:mb-16">
            <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-teal-300 mb-4 text-glow-gold">Welcome Back, User!</h1>
            <p class="text-lg md:text-xl text-teal-200 mb-8 max-w-3xl mx-auto">Here's your personalized dashboard for today.</p>
        </section>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12 md:mb-16">
            <div class="lg:col-span-2 tool-card p-4 md:p-6">
                <h2 class="text-3xl font-bold text-center mb-6 text-teal-300">Your Personalized Briefing</h2>
                <div id="daily-briefing-content" class="prose prose-invert prose-lg max-w-none">
                    <div class="text-center p-8"><div class="loader"></div><p class="text-teal-300 mt-2">Generating today's fantasy analysis...</p></div>
                </div>
            </div>
             <div class="lg:col-span-1 space-y-8">
                <div class="tool-card p-4 md:p-6">
                    <h2 class="text-2xl font-bold text-center mb-6 text-teal-300">Top Waiver Targets for You</h2>
                    <div id="waiver-wire-personalized" class="space-y-3"><div class="loader"></div></div>
                </div>
                 <div class="tool-card p-4 md:p-6">
                    <h2 class="text-2xl font-bold text-center mb-6 text-teal-300">Your Watchlist</h2>
                    <div id="watchlist-personalized" class="space-y-3"><div class="loader"></div></div>
                </div>
                 <div class="tool-card p-4 md:p-6">
                    <h2 class="text-2xl font-bold text-center mb-6 text-teal-300">Your Team's Weekly Report Card</h2>
                    <div id="weekly-report-card" class="space-y-3"><div class="loader"></div></div>
                </div>
                 <div class="tool-card p-4 md:p-6">
                    <h2 class="text-2xl font-bold text-center mb-6 text-teal-300">Next Opponent's Weakness</h2>
                    <div id="opponent-weakness" class="space-y-3"><div class="loader"></div></div>
                </div>
            </div>
        </div>

        <section id="top-players-section">
            <h2 class="text-4xl font-bold text-center mb-10 text-teal-300">Top Players</h2>
            <div id="player-showcase-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
                 <div class="text-center p-8 lg:col-span-4"><div class="loader"></div><p class="text-teal-300 mt-2">Loading top players...</p></div>
            </div>
        </section>
    </main>
    
    <div id="player-popup-card" class="hidden"></div>

    <div id="ai-chat-widget" class="fixed bottom-5 right-5">
        <button id="ai-chat-button" class="bg-teal-500 rounded-full w-16 h-16 flex items-center justify-center shadow-lg hover:bg-teal-400 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16h6m2 0h2a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l4-4z" />
            </svg>
        </button>
    </div>

    <footer class="bg-gray-900 text-teal-400 py-6 border-t-2 border-teal-500">
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
